
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MALISHBET LIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#071426;--panel:#0e2038;--card:#122943;--line:#203954;--blue:#28a9ff;--green:#19d6a0;--muted:#91a9c3}
body{background:var(--bg);color:#f1f6ff;font-family:Arial,sans-serif}
header{background:#091a2e;padding:16px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.logo{font-size:23px;font-weight:900}.logo span{color:var(--blue)}
select{background:var(--card);color:white;border:1px solid #315474;padding:11px;border-radius:8px}
nav{display:flex;gap:22px;padding:15px 4%;background:var(--panel);overflow:auto}
nav a{color:#c3d3e7;text-decoration:none;white-space:nowrap;font-size:13px}
.container{max-width:1450px;margin:auto;padding:22px 3%}
.hero{background:linear-gradient(120deg,#102d50,#174b79,#10213c);padding:30px;border-radius:14px;margin-bottom:20px}
.hero h1{font-size:27px;margin-bottom:10px}
.hero p{color:#c0d5eb}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 250px;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.heading{font-weight:bold;margin-bottom:15px;font-size:16px}
.sport{padding:12px;border-radius:8px;cursor:pointer;color:#c3d3e7;font-size:14px}
.sport:hover,.sport.active{background:#183e65;color:white}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}
.tab{background:var(--card);border:1px solid #294764;color:white;padding:10px 15px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tab.active{background:#1766a4}
.match{background:#10243b;border:1px solid var(--line);padding:15px;border-radius:10px;margin-bottom:10px}
.league{font-size:12px;color:var(--muted);margin-bottom:15px}
.match-content{display:grid;grid-template-columns:1fr 75px 1fr;text-align:center;align-items:center}
.team{font-weight:bold;font-size:14px}
.score{font-size:22px;font-weight:bold}
.status{font-size:11px;color:var(--green);margin-top:5px}
.match-footer{border-top:1px solid var(--line);margin-top:13px;padding-top:10px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.star{cursor:pointer;color:#9bb0c8;background:none;border:0;font-size:19px}
.star.selected{color:#ffd166}
.search{width:100%;background:#10243b;color:white;border:1px solid #315474;padding:12px;border-radius:8px;margin-bottom:14px}
.table-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
.table-row span:last-child{color:var(--green)}
.empty{color:var(--muted);font-size:13px;padding:15px 0}
footer{text-align:center;padding:30px;color:var(--muted);border-top:1px solid var(--line);margin-top:20px}
footer strong{color:var(--blue)}
[dir="rtl"]{text-align:right}
[dir="rtl"] nav,[dir="rtl"] .match-footer{direction:rtl}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sports-list{display:grid;grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){header{padding:13px}.logo{font-size:19px}.hero h1{font-size:22px}.container{padding:14px 10px}.team{font-size:12px}.score{font-size:19px}}
</style>
</head>
<body>

<header>

<nav>

<div class="container">

<div class="sport" data-sport="hockey">🏒 <span data-i="hockey"></span></div>
<div class="sport" data-sport="volleyball">🏐 <span data-i="volleyball"></span></div>

<main id="matches">

</div>
</main>

<aside>
<div class="panel" id="tables">
<div class="heading" data-i="table"></div>

</div>
<div class="panel" id="stats">

<div class="table-row"><span data-i="teams"></span><b>--</b></div>
<div class="table-row"><span data-i="liveGames"></span><b>--</b></div>
</div>
<div class="panel">

<div id="favorites" class="empty"></div>
</div>
</aside>
</div>
</div>

<footer>
<strong>MALISHBET LIVE</strong>
<p style="margin-top:10px">Professional Sports Information Center</p>
<p style="margin-top:8px">© 2026 MALISHBET LIVE</p>
</footer>

<script>

tg:{home:"Саҳифаи асосӣ",games:"Бозиҳо",table:"Ҷадвали мусобиқа",statistics:"Маркази омор",welcome:"ХУШ ОМАДЕД БА ОЛАМИ ВАРЗИШ",subtitle:"Ҳисобҳои зинда • Хабарҳо • Омор",sports:"НАМУДҲОИ ВАРЗИШ",allSports:"Ҳамаи намудҳо",football:"Футбол",basketball:"Баскетбол",tennis:"Теннис",hockey:"Хоккей",volleyball:"Волейбол",cricket:"Крикет",all:"Ҳама",live:"Зинда",today:"Имрӯз",tomorrow:"Пагоҳ",leagues:"Лигаҳо",teams:"Дастаҳо",liveGames:"Бозиҳои зинда",favorites:"Дӯстдошта",search:"Ҷустуҷӯи даста ё лига...",started:"Оғоз нашудааст",scheduled:"Банақшагирифташуда",empty:"Бозӣ нест",favoriteEmpty:"Бозии дӯстдошта нест"},
fa:{home:"صفحه اصلی",games:"مسابقات",table:"جدول لیگ",statistics:"مرکز آمار",welcome:"به دنیای ورزش خوش آمدید",subtitle:"نتایج زنده • اخبار ورزشی • آمار",sports:"ورزش‌ها",allSports:"همه ورزش‌ها",football:"فوتبال",basketball:"بسکتبال",tennis:"تنیس",hockey:"هاکی",volleyball:"والیبال",cricket:"کریکت",all:"همه",live:"زنده",today:"امروز",tomorrow:"فردا",leagues:"لیگ‌ها",teams:"تیم‌ها",liveGames:"بازی‌های زنده",favorites:"علاقه‌مندی‌ها",search:"جستجوی تیم یا لیگ...",started:"شروع نشده",scheduled:"برنامه‌ریزی شده",empty:"مسابقه‌ای نیست",favoriteEmpty:"مسابقه مورد علاقه‌ای نیست"}
};

const matches=[
{id:1,sport:"football",league:"PREMIER LEAGUE",home:"Arsenal",away:"Chelsea",score:"2 - 1",status:"LIVE 67'",filter:"live"},
{id:2,sport:"football",league:"LA LIGA",home:"Barcelona",away:"Real Madrid",score:"1 - 1",status:"LIVE 54'",filter:"live"},
{id:3,sport:"football",league:"SERIE A",home:"Inter",away:"Milan",score:"20:45",status:"",filter:"today"},
{id:4,sport:"football",league:"CHAMPIONS LEAGUE",home:"PSG",away:"Bayern",score:"22:00",status:"",filter:"today"},
{id:5,sport:"basketball",league:"NBA",home:"Lakers",away:"Warriors",score:"89 - 85",status:"LIVE Q3",filter:"live"},
{id:6,sport:"tennis",league:"ATP TOUR",home:"Player A",away:"Player B",score:"6-4, 3-2",status:"LIVE",filter:"live"},
{id:7,sport:"hockey",league:"NHL",home:"Rangers",away:"Bruins",score:"19:00",status:"",filter:"today"},
{id:8,sport:"volleyball",league:"VOLLEYBALL",home:"Team A",away:"Team B",score:"16:00",status:"",filter:"tomorrow"},
{id:9,sport:"cricket",league:"CRICKET",home:"Team C",away:"Team D",score:"18:00",status:"",filter:"tomorrow"}
];

let lang=localStorage.getItem("malishbet_lang")||"uz";
let sport="all",filter="all";
let favorites=JSON.parse(localStorage.getItem("malishbet_favorites")||"[]");

const $=id=>document.getElementById(id);

function translate(){
const t=T[lang];
document.documentElement.lang=lang;
document.documentElement.dir=["ar","fa"].includes(lang)?"rtl":"ltr";
document.querySelectorAll("[data-i]").forEach(el=>{
el.textContent=t[el.dataset.i]||el.textContent;
});
$("search").placeholder=t.search;
$("language").value=lang;
render();
}

function render(){
const t=T[lang],q=$("search").value.toLowerCase();
const items=matches.filter(m=>
(sport==="all"||m.sport===sport)&&
(filter==="all"||m.filter===filter)&&
(m.home+" "+m.away+" "+m.league).toLowerCase().includes(q)
);
$("matchList").innerHTML=items.length?items.map(m=>`
<div class="match">
<div class="league">${m.league}</div>
<div class="match-content">
<div class="team">${m.home}</div>
<div><div class="score">${m.score}</div>
<div class="status">${m.status||t.started}</div></div>
<div class="team">${m.away}</div>
</div>
<div class="match-footer">
<span>${m.sport.toUpperCase()}</span>
<button class="star ${favorites.includes(m.id)?"selected":""}" data-star="${m.id}" aria-label="Favorite">★</button>
</div>
</div>`).join(""):`<div class="empty">${t.empty}</div>`;

$("favorites").innerHTML=matches.filter(m=>favorites.includes(m.id)).map(m=>m.home+" – "+m.away).join("<br>")||t.favoriteEmpty;
}

$("language").addEventListener("change",e=>{
lang=e.target.value;
localStorage.setItem("malishbet_lang",lang);
translate();
});

document.querySelectorAll(".sport").forEach(el=>el.addEventListener("click",()=>{
sport=el.dataset.sport;
document.querySelectorAll(".sport").forEach(x=>x.classList.toggle("active",x===el));
render();
}));

document.querySelectorAll(".tab").forEach(el=>el.addEventListener("click",()=>{
filter=el.dataset.filter;
document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===el));
render();
}));

$("search").addEventListener("input",render);

$("matchList").addEventListener("click",e=>{
const btn=e.target.closest("[data-star]");
if(!btn)return;
const id=Number(btn.dataset.star);
favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
localStorage.setItem("malishbet_favorites",JSON.stringify(favorites));
render();
});

translate();
</script>
</body>
</html>
