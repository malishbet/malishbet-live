
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALISHBET LIVE — Sports Center</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:#f3f7ff;font-family:Arial,sans-serif}
header{background:#0d203a;border-bottom:1px solid #203a5c;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900;color:#42a5ff;letter-spacing:1px}
.logo span{color:white}
select,input{background:#132b49;color:white;border:1px solid #315477;padding:11px;border-radius:8px}
nav{display:flex;gap:10px;overflow-x:auto;padding:15px 5%;background:#0a1b30}
nav button,.sport{background:#122b49;color:#dceaff;border:1px solid #294766;border-radius:9px;padding:12px 16px;white-space:nowrap;cursor:pointer}
nav button.active,.sport.active{background:#0878db;color:white}
main{max-width:1200px;margin:auto;padding:25px 5%}
.hero{background:linear-gradient(110deg,#103968,#0876c9);padding:28px;border-radius:16px;margin-bottom:22px}
.hero h1{margin:0 0 10px;font-size:30px}
.hero p{margin:0;color:#d4eaff}
.section-title{font-size:21px;margin:25px 0 14px}
.sports{display:flex;flex-wrap:wrap;gap:9px}
.match-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.match{background:#102541;border:1px solid #254263;border-radius:13px;padding:17px}
.match-top{display:flex;justify-content:space-between;color:#9bb6d5;font-size:13px;margin-bottom:15px}
.live{color:#4ee69b;font-weight:bold}
.teams{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:bold}
.score{font-size:24px;color:#54b5ff;white-space:nowrap}
.match-bottom{border-top:1px solid #29415f;margin-top:14px;padding-top:12px;color:#91aaca;font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.tools input{flex:1;min-width:180px}
footer{text-align:center;padding:25px;color:#7892b1;border-top:1px solid #1e3858;margin-top:35px}
button:hover{filter:brightness(1.2)}
[dir=rtl]{direction:rtl;text-align:right}
@media(max-width:600px){.hero h1{font-size:23px}header{padding:15px}.logo{font-size:21px}}
</style>
</head>
<body>
<header>
  <div class="logo">MALISHBET <span>LIVE</span></div>
  <select id="language" aria-label="Language">
    <option value="uz">🇺🇿 O‘zbekcha</option>
    <option value="ru">🇷🇺 Русский</option>
    <option value="en">🇬🇧 English</option>
    <option value="tr">🇹🇷 Türkçe</option>
    <option value="kk">🇰🇿 Қазақша</option>
    <option value="ar">🇸🇦 العربية</option>
    <option value="tg">🇹🇯 Тоҷикӣ</option>
    <option value="fa">🇮🇷 فارسی</option>
  </select>
</header>

<nav>
  <button class="active" data-tab="all" id="allTab">Barcha sportlar</button>
  <button data-tab="live" id="liveTab">Jonli</button>
  <button data-tab="upcoming" id="upcomingTab">Bo‘lajak</button>
</nav>

<main>
  <section class="hero">
    <h1 id="welcome">Barcha sport natijalari — bir joyda</h1>
    <p id="subtitle">Sport yangiliklari, uchrashuvlar, natijalar va turnirlar</p>
  </section>

  <h2 class="section-title" id="sportsTitle">Sport turlari</h2>
  <div class="sports" id="sports"></div>

  <div class="tools">
    <input id="search" placeholder="Jamoa yoki musobaqani qidiring...">
  </div>

  <h2 class="section-title" id="matchesTitle">Uchrashuvlar</h2>
  <div class="match-grid" id="matches"></div>

  <h2 class="section-title" id="infoTitle">MALISHBET LIVE</h2>
  <p id="infoText">18 ta sport turi bo‘yicha natijalar va musobaqalar markazi.</p>
</main>

<footer>© 2026 MALISHBET LIVE · Sports Information Center</footer>

<script>
const sports=[
 ["football","⚽","Futbol"],["basketball","🏀","Basketbol"],
 ["tennis","🎾","Tennis"],["volleyball","🏐","Voleybol"],
 ["hockey","🏒","Xokkey"],["cricket","🏏","Kriket"],
 ["tabletennis","🏓","Stol tennisi"],["badminton","🏸","Badminton"],
 ["handball","🤾","Gandbol"],["rugby","🏉","Regbi"],
 ["baseball","⚾","Beysbol"],["futsal","🥅","Futzal"],
 ["boxing","🥊","Boks"],["mma","🥋","MMA"],
 ["athletics","🏃","Yengil atletika"],["cycling","🚴","Velosport"],
 ["motorsport","🏎️","Avtosport"],["esports","🎮","Kibersport"]
];

const translations={
uz:{all:"Barcha sportlar",live:"Jonli",upcoming:"Bo‘lajak",welcome:"Barcha sport natijalari — bir joyda",subtitle:"Sport yangiliklari, uchrashuvlar, natijalar va turnirlar",sports:"Sport turlari",matches:"Uchrashuvlar",search:"Jamoa yoki musobaqani qidiring...",info:"18 ta sport turi bo‘yicha natijalar va musobaqalar markazi",status:"NAMUNAVIY",today:"Bugungi uchrashuv"},
ru:{all:"Все виды спорта",live:"В эфире",upcoming:"Предстоящие",welcome:"Все спортивные результаты — в одном месте",subtitle:"Новости, матчи, результаты и турниры",sports:"Виды спорта",matches:"Матчи",search:"Поиск команды или турнира...",info:"Центр результатов и турниров по 18 видам спорта",status:"ДЕМО",today:"Сегодняшний матч"},
en:{all:"All sports",live:"Live",upcoming:"Upcoming",welcome:"All sports results in one place",subtitle:"Sports news, matches, results and tournaments",sports:"Sports",matches:"Matches",search:"Search team or competition...",info:"Results and tournament center for 18 sports",status:"DEMO",today:"Today's match"},
tr:{all:"Tüm sporlar",live:"Canlı",upcoming:"Yaklaşan",welcome:"Tüm spor sonuçları tek yerde",subtitle:"Spor haberleri, maçlar ve turnuvalar",sports:"Spor dalları",matches:"Maçlar",search:"Takım veya turnuva ara...",info:"18 spor dalı için sonuç ve turnuva merkezi",status:"ÖRNEK",today:"Bugünün maçı"},
kk:{all:"Барлық спорт",live:"Тікелей",upcoming:"Алдағы",welcome:"Барлық спорт нәтижелері бір жерде",subtitle:"Жаңалықтар, матчтар және турнирлер",sports:"Спорт түрлері",matches:"Матчтар",search:"Команда немесе турнир іздеу...",info:"18 спорт түрі бойынша нәтижелер орталығы",status:"ҮЛГІ",today:"Бүгінгі матч"},
ar:{all:"كل الرياضات",live:"مباشر",upcoming:"القادمة",welcome:"جميع النتائج الرياضية في مكان واحد",subtitle:"أخبار ونتائج ومباريات وبطولات",sports:"الرياضات",matches:"المباريات",search:"ابحث عن فريق أو بطولة...",info:"مركز نتائج وبطولات 18 رياضة",status:"تجريبي",today:"مباراة اليوم"},
tg:{all:"Ҳамаи намудҳои варзиш",live:"Зинда",upcoming:"Оянда",welcome:"Ҳамаи натиҷаҳои варзиш дар як ҷо",subtitle:"Хабарҳо, бозиҳо ва мусобиқаҳо",sports:"Намудҳои варзиш",matches:"Бозиҳо",search:"Ҷустуҷӯи даста ё мусобиқа...",info:"Маркази натиҷаҳои 18 намуди варзиш",status:"НАМУНА",today:"Бозии имрӯз"},
fa:{all:"همه ورزش‌ها",live:"زنده",upcoming:"پیش رو",welcome:"همه نتایج ورزشی در یک مکان",subtitle:"اخبار، مسابقات و نتایج ورزشی",sports:"ورزش‌ها",matches:"مسابقات",search:"جستجوی تیم یا رقابت...",info:"مرکز نتایج و مسابقات ۱۸ رشته ورزشی",status:"نمونه",today:"مسابقه امروز"}
};

const sample=[
 {sport:"football",a:"Team Alpha",b:"Team Beta",score:"2 : 1",state:"live"},
 {sport:"basketball",a:"City Stars",b:"United Club",score:"78 : 72",state:"live"},
 {sport:"tennis",a:"Player A",b:"Player B",score:"1 : 0",state:"upcoming"},
 {sport:"volleyball",a:"North Team",b:"South Team",score:"— : —",state:"upcoming"},
 {sport:"hockey",a:"Ice Club",b:"Snow Club",score:"3 : 2",state:"live"},
 {sport:"cricket",a:"Blue XI",b:"Red XI",score:"— : —",state:"upcoming"}
];

let selected="all",tab="all";
const sportsBox=document.getElementById("sports");
const matchesBox=document.getElementById("matches");

function renderSports(){
 sportsBox.innerHTML="";
 sports.forEach(s=>{
  const b=document.createElement("button");
  b.className="sport"+(selected===s[0]?" active":"");
  b.textContent=s[1]+" "+s[2];
  b.onclick=()=>{selected=s[0];renderSports();renderMatches()};
  sportsBox.appendChild(b);
 });
}
function renderMatches(){
 const q=document.getElementById("search").value.toLowerCase();
 const rows=sample.filter(m=>(selected==="all"||m.sport===selected)&&(tab==="all"||m.state===tab)&&(m.a+" "+m.b).toLowerCase().includes(q));
 matchesBox.innerHTML="";
 if(!rows.length){matchesBox.textContent="Hozircha uchrashuv topilmadi.";return}
 rows.forEach(m=>{
  const card=document.createElement("article");
  card.className="match";
  const sport=sports.find(s=>s[0]===m.sport);
  card.innerHTML=`<div class="match-top"><span>${sport[1]} ${sport[2]}</span><span class="${m.state==="live"?"live":""}">${m.state==="live"?"● LIVE":"SOON"}</span></div><div class="teams"><span>${m.a}</span><span class="score">${m.score}</span><span>${m.b}</span></div><div class="match-bottom">${translations[language].status} · ${translations[language].today}</div>`;
  matchesBox.appendChild(card);
 });
}
let language=localStorage.getItem("malishbet-language")||"uz";
function setLanguage(lang){
 language=lang;
 localStorage.setItem("malishbet-language",lang);
 const t=translations[lang];
 document.documentElement.lang=lang;
 document.documentElement.dir=(lang==="ar"||lang==="fa")?"rtl":"ltr";
 document.getElementById("allTab").textContent=t.all;
 document.getElementById("liveTab").textContent=t.live;
 document.getElementById("upcomingTab").textContent=t.upcoming;
 document.getElementById("welcome").textContent=t.welcome;
 document.getElementById("subtitle").textContent=t.subtitle;
 document.getElementById("sportsTitle").textContent=t.sports;
 document.getElementById("matchesTitle").textContent=t.matches;
 document.getElementById("search").placeholder=t.search;
 document.getElementById("infoText").textContent=t.info;
 document.getElementById("language").value=lang;
 renderMatches();
}
document.getElementById("language").onchange=e=>setLanguage(e.target.value);
document.getElementById("search").oninput=renderMatches;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 tab=b.dataset.tab;
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");renderMatches();
});
renderSports();
setLanguage(language);
</script>
</body>
</html>
